name: Run Ubuntu 24.04.1 LTS with Python 3.9+ versions
on: [push]

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Update pip upgrade
        run: |
          python -m pip install --upgrade pip

      #--- DISPLAY PYTHON VERSION
      - name: Display Python version
        run: 
          python -c "import sys; print(sys.version)"
      
      #--- SETUP YOUR ENVIRONMENT HERE
      
      #--- DEPENDENCIES
      ## INSTALL DEPENDENCIES PYTHON
      - name: Install config packages
        run: |
          pip install coverage
          pip install ruff
          pip install poetry
      
      - name: Install project dependencies via Poetry
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
          
      
      #--- LINT
      ## LINT YOUR CODE HERE
      - name: Lint with Ruff
        run: |
          ruff check . --target-version=py310
        continue-on-error: true
      
      #--- TEST
      ## TEST YOUR CODE HERE
      - name: Test with pytest and Generate Coverage Report
        run: |
          coverage run -m pytest  -v -s
          coverage report -m

      #--- RUN    
      ## RUN YOUR SCRIPT HERE
      - name: Run code with Python
        run:
          python main.py

